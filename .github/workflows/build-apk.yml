name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename it something recognisable
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/belles-order-book.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: belles-order-book-apk
          path: out/belles-order-book.apk
          if-no-files-found: error
