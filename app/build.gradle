plugins {
    id 'com.android.application'
}

android {
    namespace 'com.belles.orderbook'
    compileSdk 34

    defaultConfig {
        applicationId "com.belles.orderbook"
        minSdk 24                 // Android 7 and up
        targetSdk 34
        versionCode 5
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // so an unsigned release still installs
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// appcompat and webkit each pull in a different Kotlin standard library, and
// the old jdk7/jdk8 add-ons overlap with the modern one. Pinning all three to
// the same recent version removes the duplicate classes.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
